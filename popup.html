<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Little Dictionary</title>
  <link rel="stylesheet" href="popup.css">
  <script defer src="popup.js"></script>
</head>
<body>
  <div class="arrow-container">
    <div class="topnav">
      <input id="search" type="text" placeholder="Search words..." aria-label="Search words">
    </div>
  </div>
  <div class="backup-controls">
    <button id="export" type="button">Export backup</button>
    <label for="import">Import backup</label>
    <input id="import" type="file" accept=".json,application/json" aria-label="Import word backup">
  </div>
  <p class="privacy-note">Saved words are sent to Wiktionary for definitions. <a href="https://github.com/magickmomo/Word-Saver/blob/master/PRIVACY.md" target="_blank" rel="noopener noreferrer">Privacy</a></p>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="container"><div id="dictionary"></div></div>
</body>
</html>
